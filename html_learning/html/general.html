<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>HTML総合課題</title>
  </head>

  <body>
    <header>
      <h1>HTML総合課題</h1>
      <nav>
        <ul>
          <li>メニュー1</li>
          <li>メニュー2</li>
        </ul>
      </nav>
    </header>

    <form>
      <h2>個人情報入力</h2>

      <table>
        <tr>
          <th>お名前</th>
          <td>
            <input type="text" placeholder="姓"><br>
            <input type="text" placeholder="名">
          </td>
        </tr>
      </table>

      <p>自己紹介</p>
      <textarea></textarea><br>

      aaa aaa aaa<br>
      aaa aaa aaa<br>
      aaa aaa aaa<br>

      <p>血液型</p>
      <select>
        <option>血液型</option>
        <option>A型</option>
        <option>B型</option>
        <option>O型</option>
        <option>AB型</option>
      </select>

      <p>性別</p>

      <label>
        男
        <input type="radio" name="gender" value="male" checked>
      </label>

      <label>
        女
        <input type="radio" name="gender" value="female">
      </label>

      <br>

      <button type="button" disabled>キャンセル</button>
      <button type="submit">送信</button>
    </form>

    <footer>
      <p>© 2019 ALCHEMY inc.</p>
    </footer>
  </body>
</html>
